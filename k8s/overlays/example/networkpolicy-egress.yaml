# Extra egress on top of the base policy (DNS + public HTTPS). Adjust the
# addresses; keep the pentest scope as narrow as the authorization.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeroclaw-egress-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zeroclaw
      app.kubernetes.io/component: agent
  policyTypes:
    - Egress
  egress:
    # Self-hosted LLM endpoint on a private network.
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 443
    # Authorized pentest targets (all ports, for security_red scans).
    - to:
        - ipBlock:
            cidr: 192.0.2.128/28
