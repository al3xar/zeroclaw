apiVersion: v1
kind: Namespace
metadata:
  name: zeroclaw
  labels:
    # The pod satisfies the `restricted` Pod Security Standard: non-root,
    # no privilege escalation, all capabilities dropped, RuntimeDefault
    # seccomp. Landlock works under these constraints; bubblewrap does not
    # (it needs user namespaces and a fresh /proc). See k8s/README.md.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
